name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No dependencies: the plugin only imports Node built-ins, and the tests
      # drive stub CLIs, so nothing needs installing and nothing hits the network.
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Test
        run: npm test
