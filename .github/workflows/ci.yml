name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      # The published plugin bundles its UI; contributors install the frontend
      # toolchain here. Harness-only peers are supplied by DSH at runtime.
      - name: Install frontend toolchain
        run: npm ci --legacy-peer-deps
      - name: Build shared dashboards
        run: npm run build
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Test
        run: npm test
